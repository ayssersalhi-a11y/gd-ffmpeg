# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  GitHub Actions — بناء libgdffmpeg.so (OpenSSL + FFmpeg)                 ║
# ║  v6 — بنية addons/gdffmpeg صحيحة + إزالة الضغط المزدوج (Double-Zip)      ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: Build libgdffmpeg.so (OpenSSL + FFmpeg)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            arch: arm64
          - platform: linux
            arch: x86_64
          - platform: linux
            arch: arm64


    env:
      NDK_VERSION:        r26c
      GODOT_CPP_BRANCH:   godot-4.3-stable
      FFMPEG_VERSION:     "7.0"
      OPENSSL_VERSION:    "3.0.13"
      ANDROID_API:        "24"

    steps:
      # ── 1. استنساخ الريبو ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── [إضافة جديدة] التنظيف قبل البدء ─────────────────────────────────────
      - name: Clean build environment
        run: |
          echo "Cleaning up old build artifacts..."
          rm -rf ffmpeg_source/
          rm -rf ffmpeg_build/
          rm -rf _cmake_build/
          
      # ── 2. Android NDK ───────────────────────────────────────────────────────
      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      
# ── 3. أدوات البناء ───────────────────────────────────────────────────────────────
      - name: Install build tools
        run: |
          # 1. إضافة المعمارية
          sudo dpkg --add-architecture arm64

          # 2. كتابة ملف sources.list جديد بالكامل بشكل صريح
          #    (بدل تعديل الملفات الموجودة بـ sed، لأن تنسيقها قد يختلف
          #     بين صور الـ runner ويسبب بقاء بعض الأسطر بدون تقييد arch)
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo bash -c 'cat <<EOF > /etc/apt/sources.list
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
          EOF'

          # 3. التحديث والتثبيت
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build nasm yasm python3 git \
            pkg-config perl wget \
            libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev alsa-utils libasound2-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            zlib1g-dev zlib1g-dev:arm64
            
      # ── 4. كاش godot-cpp ────────────────────────────────────────────────────
      - name: Cache godot-cpp
        uses: actions/cache@v4
        id: cache-godotcpp
        with:
          path: godot-cpp
          key: godot-cpp-${{ env.GODOT_CPP_BRANCH }}-v1

      - name: Clone godot-cpp
        if: steps.cache-godotcpp.outputs.cache-hit != 'true'
        run: |
          git clone --recursive \
            https://github.com/godotengine/godot-cpp.git \
            --branch ${{ env.GODOT_CPP_BRANCH }} \
            --depth 1 \
            godot-cpp

      # ── 5. كاش OpenSSL ──────────────────────────────────────────────────────
      - name: Cache OpenSSL
        uses: actions/cache@v4
        id: cache-openssl
        with:
          path: openssl_build
          # [v3] رُفع الرقم لإبطال الكاش القديم بعد إصلاح سكريبت البناء
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}-v3

      # ── 6. بناء OpenSSL (إذا لم يوجد في الكاش) ──────────────────────────────
      - name: Build OpenSSL for ${{ matrix.platform }} (${{ matrix.arch }})
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          OPENSSL_VERSION: ${{ env.OPENSSL_VERSION }}
          API_LEVEL: ${{ env.ANDROID_API }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x build_openssl_android.sh
          ./build_openssl_android.sh

      - name: Verify OpenSSL output
        run: |
          # [إصلاح] كان هذا يفحص المسار المسطّح "openssl_build/lib" الذي لا
          # يوجد أبدًا فعليًا (المخرجات دائمًا تحت مجلد فرعي حسب المنصة/المعمارية
          # مثل openssl_build/android-arm64/lib) — فكانت هذه الخطوة صامتة تمامًا
          # لا تتحقق من شيء (`|| true` يُخفي الفشل الدائم). الآن تحسب المسار الصحيح.
          OPENSSL_SUBDIR="android-arm64"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            OPENSSL_SUBDIR="linux-${{ matrix.arch }}"
          fi
          echo "── ملفات OpenSSL (${OPENSSL_SUBDIR}) ──"
          ls -lh "openssl_build/${OPENSSL_SUBDIR}/lib/" || true
          ls "openssl_build/${OPENSSL_SUBDIR}/include/openssl/" | head -10 || true

      # ── 7. كاش FFmpeg ────────────────────────────────────────────────────────
      - name: Cache FFmpeg
        uses: actions/cache@v4
        id: cache-ffmpeg
        with:
          path: ffmpeg_build
          # [v5] رُفع الرقم — تغيّرت فعليًا خيارات بناء FFmpeg: تفعيل rtmp/rtsp،
          # ديكودرز MediaCodec الصريحة، flv/rtsp demuxer، vorbis، وفصل مسار
          # مخرجات Linux حسب المعمارية. دون رفع الرقم، سيستمر CI باستخدام
          # الكاش القديم متجاهلاً كل هذه الإصلاحات.
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}-v5

      # ── 8. بناء FFmpeg (إذا لم يوجد في الكاش) ────────────────────────────────
      - name: Build FFmpeg + OpenSSL for ${{ matrix.platform }} (${{ matrix.arch }})
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          FFMPEG_VERSION: ${{ env.FFMPEG_VERSION }}
          API_LEVEL: ${{ env.ANDROID_API }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x ffmpeg_build_android.sh
          ./ffmpeg_build_android.sh


      # ── 9. التحقق من OpenSSL قبل البناء ──────────────────────────────────────
      - name: Debug - Check if OpenSSL files exist
        run: |
          OPENSSL_SUBDIR="android-arm64"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            OPENSSL_SUBDIR="linux-${{ matrix.arch }}"
          fi

          echo "Looking for OpenSSL libraries in: openssl_build/${OPENSSL_SUBDIR}/lib"

          if [ -d "${{ github.workspace }}/openssl_build/${OPENSSL_SUBDIR}/lib64" ] && [ ! -f "${{ github.workspace }}/openssl_build/${OPENSSL_SUBDIR}/lib/libssl.a" ]; then
            echo "[INFO] Detected lib64 folder, copying contents to lib for compatibility..."
            mkdir -p "${{ github.workspace }}/openssl_build/${OPENSSL_SUBDIR}/lib"
            cp -r ${{ github.workspace }}/openssl_build/${OPENSSL_SUBDIR}/lib64/* ${{ github.workspace }}/openssl_build/${OPENSSL_SUBDIR}/lib/
          fi

          if [ -f "${{ github.workspace }}/openssl_build/${OPENSSL_SUBDIR}/lib/libssl.a" ]; then
            echo "✅ Success: libssl.a found!"
          else
            echo "::error:: File libssl.a is genuinely missing at openssl_build/${OPENSSL_SUBDIR}/lib!"
            exit 1
          fi

       # ── 10. بناء libgdffmpeg.so ───────────────────────────────────────────────
      - name: Build libgdffmpeg.so
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # [إضافة جديدة] مسح أي ذاكرة تخزين مؤقت قديمة لـ CMake
          rm -rf _cmake_build/${{ matrix.arch }}/*
          
          if [ "${{ matrix.platform }}" = "android" ]; then
            cmake -S . -B _cmake_build/${{ matrix.arch }} \
              -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DGODOT_CPP_DIR="${{ github.workspace }}/godot-cpp" \
              -DFFMPEG_DIR="${{ github.workspace }}/ffmpeg_build" \
              -DOPENSSL_BASE_DIR="${{ github.workspace }}/openssl_build"
          elif [ "${{ matrix.platform }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            cmake -S . -B _cmake_build/${{ matrix.arch }} \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DGODOT_CPP_DIR="${{ github.workspace }}/godot-cpp" \
              -DFFMPEG_DIR="${{ github.workspace }}/ffmpeg_build" \
              -DOPENSSL_BASE_DIR="${{ github.workspace }}/openssl_build"
          else
            cmake -S . -B _cmake_build/${{ matrix.arch }} \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DGODOT_CPP_DIR="${{ github.workspace }}/godot-cpp" \
              -DFFMPEG_DIR="${{ github.workspace }}/ffmpeg_build" \
              -DOPENSSL_BASE_DIR="${{ github.workspace }}/openssl_build"
          fi
          cmake --build _cmake_build/${{ matrix.arch }} --parallel $(nproc)

      # ── 11. جمع الملفات في مجلد واحد (Deployment Ready) ─────────────────────
      - name: Collect output files
        run: |
          # [إصلاح البنية] بنية addons/gdffmpeg/bin مطابقة تمامًا لما يتوقعه
          # gdffmpeg.gdextension داخليًا (res://addons/gdffmpeg/bin/...) —
          # بدل بنية مسطّحة (bin/ فقط) كانت تتطلب إعادة ترتيب يدوي من المستخدم.
          mkdir -p dist/addons/gdffmpeg/bin

          # نسخ ملفات المكتبة المشتركة (.so) من مسارات البناء المختلفة
          find _cmake_build -name "*.so" -exec cp {} dist/addons/gdffmpeg/bin/ \;

          # نسخ ملف الـ gdextension داخل مجلد الإضافة نفسه (وليس بجانبه)
          cp gdffmpeg.gdextension dist/addons/gdffmpeg/

          echo "══ محتويات مجلد التوزيع النهائي (dist) ══"
          ls -R dist/

       # ── 12. رفع الملفات ───────────────────────────────────────────────────────
      - name: Upload compiled .so files
        uses: actions/upload-artifact@v4
        with:
          name: libgdffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/
          retention-days: 30
          if-no-files-found: error


      # ── 13. ملخص ─────────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          {
            echo "## ✅ البناء مكتمل لمنصة (${{ matrix.platform }})"
            echo ""
            echo "| الملف | الحجم |"
            echo "|-------|-------|"
            # [تصحيح المسار] يطابق البنية الجديدة addons/gdffmpeg/bin
            for f in dist/addons/gdffmpeg/bin/*; do
              [ -f "$f" ] && echo "| \`$(basename $f)\` | $(du -h $f | cut -f1) |"
            done
          } >> $GITHUB_STEP_SUMMARY
  bundle:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      # ── 1. سحب المستودع للحصول على ملف الـ gdextension ───────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. تحميل جميع المخرجات من الـ Matrix بناءً على الـ artifacts ──
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      # ── 3. ترتيب الملفات في بنية addons/gdffmpeg الصحيحة ─────────────────
      - name: Organize into addon structure
        run: |
          # [إصلاح الاسم والمسار] بنية addons/gdffmpeg/bin مطابقة تمامًا لِما
          # يتوقعه gdffmpeg.gdextension داخليًا (res://addons/gdffmpeg/bin/...).
          # لا نُنشئ ملف ZIP يدويًا هنا إطلاقًا — GitHub Actions يُغلّف أي
          # Artifact بضغطة تحميل واحدة تلقائيًا بنفسه؛ لو ضغطنا نحن أيضًا
          # يدويًا، يحصل المستخدم على ZIP بداخله ZIP آخر (ضغط مزدوج) عليه
          # فك الضغط مرتين قبل الوصول لأي ملف فعلي — وهذا ما كان يحدث سابقًا.
          mkdir -p dist/addons/gdffmpeg/bin

          # استخراج جميع ملفات الـ .so من مخرجات كل منصة ووضعها في bin/
          find all_artifacts -name "*.so" -exec cp {} dist/addons/gdffmpeg/bin/ \;

          # نسخ ملف الـ gdextension داخل مجلد الإضافة نفسه
          cp gdffmpeg.gdextension dist/addons/gdffmpeg/

          echo "══ محتويات مجلد التوزيع النهائي (سيظهر بهذا الشكل بعد فك ضغط واحد) ══"
          ls -R dist/

      # ── 4. رفع مجلد الإضافة مباشرة (وليس ملف ZIP) ─────────────────────────
      # النتيجة: يحمّل المستخدم ملف gdffmpeg-plugin-vNNN.zip (تغليف GitHub
      # التلقائي الوحيد)، وعند فك الضغط مرة واحدة فقط يجد مجلد "addons/"
      # جاهزًا للسحب مباشرة إلى جذر مشروع Godot الخاص به.
      - name: Upload Final Addon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdffmpeg-plugin-v${{ github.run_number }}
          path: dist
          retention-days: 30
          if-no-files-found: error
